name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Detect Android Project & Validate Components
        id: detect_project
        run: |
          echo "=== Detecting Android Project Root and Wrapper ==="
          WRAPPER_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)

          if [ -z "$WRAPPER_PATH" ]; then
            echo "::error::Gradle wrapper (gradlew) could not be found in the repository!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER_PATH")
          echo "Found Android project directory at: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::Android project configuration (settings.gradle / settings.gradle.kts) missing at $PROJECT_DIR!"
            exit 1
          fi

          APP_MODULE_DIR=""
          for dir in "$PROJECT_DIR"/*; do
            if [ -d "$dir" ] && ([ -f "$dir/build.gradle" ] || [ -f "$dir/build.gradle.kts" ]); then
              if grep -q 'com.android.application' "$dir/build.gradle"* 2>/dev/null; then
                APP_MODULE_DIR="$dir"
                break
              fi
            fi
          done

          if [ -z "$APP_MODULE_DIR" ] && [ -d "$PROJECT_DIR/app" ]; then
            APP_MODULE_DIR="$PROJECT_DIR/app"
          fi

          if [ -z "$APP_MODULE_DIR" ]; then
            echo "::error::Application module could not be identified!"
            exit 1
          fi

          MODULE_NAME=$(basename "$APP_MODULE_DIR")
          echo "Found application module: $MODULE_NAME ($APP_MODULE_DIR)"

          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "module_name=$MODULE_NAME" >> $GITHUB_OUTPUT

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x "${{ steps.detect_project.outputs.project_dir }}/gradlew"

      - name: Clean Stale Build Caches
        run: |
          PROJECT_DIR="${{ steps.detect_project.outputs.project_dir }}"
          MODULE_NAME="${{ steps.detect_project.outputs.module_name }}"
          echo "Cleaning stale build caches and generated outputs..."
          rm -rf "$PROJECT_DIR/.gradle"
          rm -rf "$PROJECT_DIR/$MODULE_NAME/build"
          rm -rf "$PROJECT_DIR/build"

      - name: Generate Debug Keystore if Needed
        run: |
          PROJECT_DIR="${{ steps.detect_project.outputs.project_dir }}"
          KEYSTORE_PATH="$PROJECT_DIR/debug.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Generating debug keystore at $KEYSTORE_PATH..."
            keytool -genkey -v -keystore "$KEYSTORE_PATH" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Debug keystore already present."
          fi

      - name: Build Debug APK
        run: |
          PROJECT_DIR="${{ steps.detect_project.outputs.project_dir }}"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate and Verify Generated APK
        id: locate_apk
        run: |
          PROJECT_DIR="${{ steps.detect_project.outputs.project_dir }}"
          MODULE_NAME="${{ steps.detect_project.outputs.module_name }}"

          echo "Searching for generated debug APK files..."
          APK_PATH=$(find "$PROJECT_DIR/$MODULE_NAME/build" -type f -name "*.apk" 2>/dev/null | head -n 1)

          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find "$PROJECT_DIR" -type f -name "*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::No valid debug APK file was generated!"
            exit 1
          fi

          echo "Found generated APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
